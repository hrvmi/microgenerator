<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPS Microgenerator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar sidebar-left">
      <div class="brand">
        <span class="brand-name">MicroGenerator</span>
        <span class="brand-meta">INDEX 01 / 01</span>
        <span class="brand-meta">TYPE: ASCII PATTERNS</span>
      </div>

      <div class="controls">
        <div class="control-row">
          <label for="variation">Variation</label>
          <select id="variation" class="control-select">
            <option value="blocks">Blocks</option>
            <option value="dots">Dots</option>
            <option value="lines">Lines</option>
            <option value="waves">Waves</option>
            <option value="binary">Binary</option>
            <option value="letters">Letters</option>
            <option value="numbers">Numbers</option>
            <option value="symbols">Symbols</option>
            <option value="mixed">Mixed</option>
            <option value="braille">Braille</option>
            <option value="minimal">Minimal</option>
            <option value="cross">Cross</option>
            <option value="slash">Slash</option>
          </select>
        </div>

        <div class="control-row">
          <label for="density">Density</label>
          <input type="range" id="density" min="0" max="100" value="50">
          <span class="value mono" data-for="density">0.50</span>
        </div>

        <div class="control-row">
          <label for="scale">Scale</label>
          <input type="range" id="scale" min="0" max="100" value="40">
          <span class="value mono" data-for="scale">0.40</span>
        </div>

        <div class="control-row">
          <label for="complexity">Complexity</label>
          <input type="range" id="complexity" min="0" max="100" value="60">
          <span class="value mono" data-for="complexity">0.60</span>
        </div>

        <div class="control-row">
          <label for="contrast">Contrast</label>
          <input type="range" id="contrast" min="0" max="100" value="30">
          <span class="value mono" data-for="contrast">0.30</span>
        </div>

        <button type="button" class="action-btn generate-btn" id="generateBtn">Generate</button>
        <span class="shortcut-hint mono">G — Generate</span>
      </div>
    </aside>

    <main class="stage">
      <div class="preview-frame">
        <span class="crop-mark tl"></span>
        <span class="crop-mark tr"></span>
        <span class="crop-mark bl"></span>
        <span class="crop-mark br"></span>
        <div class="preview-box" id="preview">
          <div class="preview-svg" id="previewSvg"></div>
        </div>
      </div>
    </main>

    <aside class="sidebar sidebar-right">
      <div class="output-block">
        <span class="section-label">Output</span>
        <dl class="output-specs">
          <div><dt>Ratio</dt><dd id="specRatio" class="mono">16:9</dd></div>
          <div><dt>Size</dt><dd id="specSize" class="mono">1024 px</dd></div>
          <div><dt>Format</dt><dd id="specFormat" class="mono">SVG</dd></div>
          <div><dt>Style</dt><dd id="specStyle" class="mono">Blocks</dd></div>
        </dl>
      </div>

      <div class="ratio-block">
        <span class="section-label">Frame</span>
        <div class="ratio-grid">
          <button type="button" class="ratio-btn" data-ratio="9:16" title="9:16"><span class="ratio-shape" style="--w:9;--h:16"></span></button>
          <button type="button" class="ratio-btn" data-ratio="3:4" title="3:4"><span class="ratio-shape" style="--w:3;--h:4"></span></button>
          <button type="button" class="ratio-btn" data-ratio="4:5" title="4:5"><span class="ratio-shape" style="--w:4;--h:5"></span></button>
          <button type="button" class="ratio-btn" data-ratio="1:1" title="1:1"><span class="ratio-shape" style="--w:1;--h:1"></span></button>
          <button type="button" class="ratio-btn" data-ratio="5:4" title="5:4"><span class="ratio-shape" style="--w:5;--h:4"></span></button>
          <button type="button" class="ratio-btn" data-ratio="4:3" title="4:3"><span class="ratio-shape" style="--w:4;--h:3"></span></button>
          <button type="button" class="ratio-btn active" data-ratio="16:9" title="16:9"><span class="ratio-shape" style="--w:16;--h:9"></span></button>
          <button type="button" class="ratio-btn" data-ratio="2:1" title="2:1"><span class="ratio-shape" style="--w:2;--h:1"></span></button>
        </div>
      </div>

      <div class="format-block">
        <span class="section-label">Format</span>
        <select id="format" class="format-select">
          <option value="svg" selected>SVG</option>
          <option value="png">PNG</option>
          <option value="jpg">JPG</option>
          <option value="webp">WebP</option>
        </select>

        <button type="button" class="action-btn export-btn" id="exportBtn">Export</button>
      </div>
    </aside>
  </div>

  <script src="app.js"></script>
</body>
</html>
